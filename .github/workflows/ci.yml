name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: build loader (dev fingerprint tag)
        run: go build -tags cryptship_devfp ./cmd/cryptship-loader

      - name: test
        run: go test -race ./...

      - name: fuzz (10s per target)
        run: |
          for t in FuzzUntar:./pkg/archive FuzzReadFile:./pkg/archive FuzzParse:./pkg/license \
                   FuzzVerifyKeyResponse:./pkg/online FuzzVerifyCheckResponse:./pkg/online \
                   FuzzVerifyAttestedKeyResponse:./pkg/online FuzzCheckChallenge:./pkg/online; do
            go test -run='^$' -fuzz="^${t%%:*}\$" -fuzztime=10s "${t#*:}"
          done

      - name: test Python helper
        run: python3 -m unittest discover -s helpers/python -v

  docs-diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate mermaid diagrams
        run: bash scripts/check-mermaid.sh # renders each block via the pinned mermaid-cli image
